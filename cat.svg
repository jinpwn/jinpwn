<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 60" width="100%" height="60">
    <defs>
        <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="fur-top" />
            <stop offset="0.55" class="fur-mid" />
            <stop offset="1" class="fur-belly" />
        </linearGradient>

        <style>
            /* Light theme */
            .fur-top { stop-color: #29323f; }
            .fur-mid { stop-color: #3a4657; }
            .fur-belly { stop-color: #5a677a; }
            .fur { fill: url(#furGrad); }
            .fur-limb { fill: #364253; }
            .fur-back { fill: #1c2430; }
            .tail-stroke { fill: none; stroke: #2f3a4a; stroke-width: 2.8; stroke-linecap: round; }
            .stripe { fill: none; stroke: #121821; stroke-width: 0.9; stroke-linecap: round; opacity: 0.45; }
            .muzzle { fill: #7a8698; opacity: 0.55; }
            .ear-inner { fill: #c98a9a; opacity: 0.8; }
            .nose { fill: #d98ca0; }
            .mouth { fill: none; stroke: #121821; stroke-width: 0.35; stroke-linecap: round; }
            .whiskers { fill: none; stroke: #64748b; stroke-width: 0.35; stroke-linecap: round; }
            .eyes { fill: #38bdf8; stroke: #0b1220; stroke-width: 0.35; }
            .pupil { fill: #0b1220; }
            .glint { fill: #ffffff; opacity: 0.9; }
            .eyes-closed { fill: none; stroke: #0b1220; stroke-width: 0.5; stroke-linecap: round; }
            .tongue { fill: #f472b6; }
            .cat-shadow { fill: #0f172a; opacity: 0.18; }

            /* Dark theme: lift the fur off the dark background */
            @media (prefers-color-scheme: dark) {
                .fur-top { stop-color: #7b8899; }
                .fur-mid { stop-color: #96a3b4; }
                .fur-belly { stop-color: #bcc6d2; }
                .fur-limb { fill: #8b98aa; }
                .fur-back { fill: #556274; }
                .tail-stroke { stroke: #7f8c9e; }
                .stripe { stroke: #3f4a5a; }
                .muzzle { fill: #dde4ec; }
                .whiskers { stroke: #e2e8f0; }
                .mouth { stroke: #2a3340; }
                .eyes-closed { stroke: #1b2430; }
                .cat-shadow { fill: #000000; opacity: 0.35; }
            }

            .packet-core { fill: #ffffff; }
            .packet-glow { fill: #38bdf8; opacity: 0.8; filter: drop-shadow(0 0 5px #38bdf8); }

            .master-x-cat { animation: masterXCat 10s linear infinite; }
            .master-x-packet { animation: masterXPacket 10s linear infinite; }

            @keyframes masterXCat {
                0% { transform: translateX(-150px) scaleX(1); }
                20% { transform: translateX(350px) scaleX(1); }
                64.99% { transform: translateX(350px) scaleX(1); }
                65% { transform: translateX(350px) scaleX(-1); }
                75% { transform: translateX(350px) scaleX(-1); }
                100% { transform: translateX(-250px) scaleX(-1); }
            }
            @keyframes masterXPacket {
                0% { transform: translate(-50px, 40px); }
                18% { transform: translate(450px, 40px); }
                60% { transform: translate(450px, 40px); }
                62% { transform: translate(450px, -5px); }
                64% { transform: translate(250px, -5px); }
                65% { transform: translate(250px, 40px); }
                75% { transform: translate(250px, 40px); }
                95% { transform: translate(-300px, 40px); }
                100% { transform: translate(-300px, 40px); }
            }

            .state-run { animation: toggleRun 10s infinite; }
            .state-wonder { animation: toggleWonder 10s infinite; }
            .state-groom { animation: toggleGroom 10s infinite; }

            @keyframes toggleRun {
                0%, 19.99% { opacity: 1; }
                20%, 74.99% { opacity: 0; }
                75%, 100% { opacity: 1; }
            }
            @keyframes toggleWonder {
                0%, 19.99% { opacity: 0; }
                20%, 29.99% { opacity: 1; }
                30%, 64.99% { opacity: 0; }
                65%, 74.99% { opacity: 1; }
                75%, 100% { opacity: 0; }
            }
            @keyframes toggleGroom {
                0%, 29.99% { opacity: 0; }
                30%, 64.99% { opacity: 1; }
                65%, 100% { opacity: 0; }
            }

            .run-master { animation: runMaster 0.35s infinite linear; transform-origin: 0px 2px; }
            .run-torso { animation: runTorso 0.35s infinite linear; transform-origin: -2px 2px; }
            .run-head-grp { animation: runHead 0.35s infinite linear; transform-origin: 12px -2px; }
            .run-tail { animation: runTail 0.35s infinite linear; transform-origin: -14px 0px; }

            .run-f-shoulder { animation: runFShoulder 0.35s infinite linear; }
            .run-f-arm { animation: runFArm 0.35s infinite linear; }
            .run-b-thigh { animation: runBThigh 0.35s infinite linear; }
            .run-b-calf { animation: runBCalf 0.35s infinite linear; }
            .offset-anim { animation-delay: -0.05s; }

            @keyframes runMaster {
                0% { transform: translateY(0px) rotate(-4deg); }
                25% { transform: translateY(-1px) rotate(-6deg); }
                50% { transform: translateY(-7px) rotate(4deg); }
                75% { transform: translateY(-3px) rotate(6deg); }
                100% { transform: translateY(0px) rotate(-4deg); }
            }
            @keyframes runTorso {
                0% { transform: scaleX(1.12) scaleY(0.92); }
                25% { transform: scaleX(1.0) scaleY(1.0); }
                50% { transform: scaleX(0.88) scaleY(1.08); }
                75% { transform: scaleX(1.0) scaleY(1.0); }
                100% { transform: scaleX(1.12) scaleY(0.92); }
            }
            @keyframes runHead {
                0% { transform: rotate(4deg) translateY(0px); }
                25% { transform: rotate(6deg) translateY(1px); }
                50% { transform: rotate(-4deg) translateY(2px); }
                75% { transform: rotate(-6deg) translateY(0px); }
                100% { transform: rotate(4deg) translateY(0px); }
            }
            @keyframes runTail {
                0% { transform: rotate(10deg); }
                25% { transform: rotate(0deg); }
                50% { transform: rotate(-35deg); }
                75% { transform: rotate(-15deg); }
                100% { transform: rotate(10deg); }
            }
            @keyframes runFShoulder {
                0% { transform: rotate(-55deg); }
                25% { transform: rotate(5deg); }
                50% { transform: rotate(55deg); }
                75% { transform: rotate(-10deg); }
                100% { transform: rotate(-55deg); }
            }
            @keyframes runFArm {
                0% { transform: rotate(0deg); }
                25% { transform: rotate(15deg); }
                50% { transform: rotate(-40deg); }
                75% { transform: rotate(-75deg); }
                100% { transform: rotate(0deg); }
            }
            @keyframes runBThigh {
                0% { transform: rotate(65deg); }
                25% { transform: rotate(20deg); }
                50% { transform: rotate(-45deg); }
                75% { transform: rotate(-15deg); }
                100% { transform: rotate(65deg); }
            }
            @keyframes runBCalf {
                0% { transform: rotate(15deg); }
                25% { transform: rotate(-70deg); }
                50% { transform: rotate(-50deg); }
                75% { transform: rotate(-15deg); }
                100% { transform: rotate(15deg); }
            }

            .wonder-head { animation: wonderHead 2s infinite ease-in-out; transform-origin: 14px -5px; }
            .wonder-tail { animation: wagIdle 2s infinite ease-in-out; transform-origin: -15px 2px; }
            @keyframes wonderHead {
                0%, 100% { transform: rotate(0deg); }
                30%, 40% { transform: rotate(-20deg); }
                60%, 70% { transform: rotate(10deg); }
            }
            @keyframes wagIdle {
                0%, 100% { transform: rotate(-10deg); }
                50% { transform: rotate(18deg); }
            }

            .groom-head { animation: lickBob 0.5s infinite linear; transform-origin: 5px -7px; }
            .groom-tail { animation: tailFlick 3s infinite ease-in-out; transform-origin: -11px 15px; }
            @keyframes lickBob {
                0%, 100% { transform: rotate(0deg) translateY(0); }
                50% { transform: rotate(-8deg) translateY(1.5px); }
            }
            @keyframes tailFlick {
                0%, 100% { transform: rotate(0deg); }
                50% { transform: rotate(4deg); }
            }

            .packet-bounce { animation: packetBob 0.6s infinite alternate ease-in-out; }
            @keyframes packetBob {
                0% { transform: translateY(-3px); }
                100% { transform: translateY(3px); }
            }
        </style>

        <!-- Torso: deep chest, tucked belly, rounded haunch -->
        <path id="torso" d="M -17 0.5 C -17.5 -4.5, -12 -6, -7 -5 C -2 -4, 3 -6.5, 9 -5.5 C 13.5 -4.8, 15.5 -1, 14 3 C 12.8 6.2, 9 7, 5 6.4 C 1 6, -3 5.8, -7 6.8 C -11.5 7.8, -16.5 5.5, -17 0.5 Z" />
        <path id="torso-stripes" class="stripe" d="M -12 -4.8 Q -11 -2.5 -12.4 -0.5 M -8.5 -5 Q -7.5 -2.6 -8.6 -0.4 M -5 -4.7 Q -4.2 -2.6 -5 -0.8 M -1.5 -4.6 Q -0.8 -2.8 -1.4 -1.2 M 2 -5.1 Q 2.8 -3.4 2.2 -2" />

        <!-- Running limb segments (local origin = joint) -->
        <path id="leg-thigh" d="M -3.8 -2 C -4.5 2, -2.5 6, -1.3 7.2 L 1.5 7.2 C 2.5 4, 3.5 1, 3 -2 Z" />
        <path id="leg-calf" d="M -1.3 0 L -0.9 6.4 Q -1 7.8 0.5 7.8 L 3 7.8 Q 3.8 7.4 2.8 6.6 L 1.3 6.2 L 1.4 0 Z" />
        <path id="leg-upper" d="M -2.6 -1.5 C -2.8 2, -2 4.5, -1.5 6.3 L 1.5 6.3 C 2 4, 2.6 1.5, 2.4 -1.5 Z" />
        <path id="leg-fore" d="M -1.4 0 L -1.1 6.4 Q -1.2 7.8 0.3 7.8 L 2.8 7.8 Q 3.6 7.4 2.6 6.6 L 1.1 6.2 L 1.3 0 Z" />

        <!-- Standing legs: knee forward, hock back, digitigrade paw -->
        <path id="stand-hind" d="M -15.5 0 C -16.5 5, -15 8, -13.6 9.6 L -12.6 13.2 L -11.4 17.4 Q -11.3 18.7 -10.1 18.7 L -6.9 18.7 Q -5.9 18.5 -6.8 17.4 L -8.8 16.6 L -9.6 13 L -7 9.2 C -5.8 7, -5.6 5, -6 3 Z" />
        <path id="stand-front" d="M 5.5 2 L 6.2 12 L 6.6 17.3 Q 6.4 18.7 7.8 18.7 L 10.9 18.7 Q 11.9 18.4 10.9 17.4 L 9.8 16.8 L 9.6 12 L 10.8 4 C 11 3, 10.8 2.5, 10.5 2 Z" />

        <!-- Head in profile: wedge skull, short muzzle, tall ears -->
        <g id="head-base">
            <path class="fur-back" d="M -5 -3.5 Q -5.2 -8.5 -3.6 -11 Q -1.5 -8 -0.6 -5.5 Z" />
            <path class="fur" d="M -6.2 0 C -6.5 4, -4 7.5, -0.5 7.5 L 2.5 6 C 3.5 4.5, 3.8 3, 3.4 2 Z" />
            <path class="fur" d="M -6.4 0.8 C -7.2 -4, -4 -7.2, 0 -7.2 C 3 -7.2, 5 -5.6, 6 -3.6 C 6.8 -2.6, 8.3 -1.9, 8.5 -0.6 C 8.6 0.6, 7.7 1.4, 6.7 1.6 C 6.4 2.8, 5 3.6, 3.5 3.4 C 1 4.6, -3.2 4.6, -6.4 0.8 Z" />
            <ellipse class="muzzle" cx="6" cy="0.9" rx="2.6" ry="1.6" />
            <path class="stripe" d="M -1.2 -6.6 Q -0.6 -5.2 -0.8 -4 M 0.5 -6.8 Q 1.5 -5.5 1.2 -4.2 M 2.2 -6.6 Q 3 -5.6 3 -4.6" />
            <path class="fur" d="M -2 -5.6 Q -1 -10.2 0.8 -12.4 Q 3.2 -9.4 4.2 -5.8 Z" />
            <path class="ear-inner" d="M -0.6 -6.2 Q 0.1 -9.2 0.9 -10.6 Q 2.3 -8.6 2.9 -6.3 Z" />
            <path class="nose" d="M 7.7 -1.1 Q 8.6 -1.1 8.7 -0.5 L 8.1 0.1 Q 7.6 -0.4 7.7 -1.1 Z" />
            <path class="mouth" d="M 8.1 0.1 Q 7.8 1 6.8 1.2" />
            <path class="whiskers" d="M 6.6 0.3 Q 10 -0.6 13.5 -0.9 M 6.6 0.8 Q 10 0.9 13.8 1.6 M 6.4 1.3 Q 9.5 2.2 12.6 3.6" />
        </g>

        <!-- Almond eye with slit pupil -->
        <g id="eye-open">
            <path class="eyes" d="M 2.6 -2.6 Q 4 -4 5.4 -2.9 Q 4 -1.7 2.6 -2.6 Z" />
            <ellipse class="pupil" cx="4.2" cy="-2.8" rx="0.42" ry="1.05" />
            <circle class="glint" cx="4.6" cy="-3.2" r="0.3" />
        </g>
    </defs>

    <g class="master-x-packet">
        <g class="packet-bounce">
            <circle cx="0" cy="0" r="4.5" class="packet-glow" />
            <circle cx="0" cy="0" r="2" class="packet-core" />
        </g>
    </g>

    <g class="master-x-cat">
        <g transform="translate(0, 35)">
            <ellipse class="cat-shadow" cx="0" cy="19" rx="16" ry="2.2" />

            <!-- RUN -->
            <g class="state-run">
                <g class="run-master">
                    <!-- far hind -->
                    <g transform="translate(-8, 1)">
                        <g class="run-b-thigh offset-anim" style="transform-origin: 0px 0px;">
                            <use href="#leg-thigh" xlink:href="#leg-thigh" class="fur-back" />
                            <g class="run-b-calf offset-anim" transform="translate(0, 7)" style="transform-origin: 0px 0px;">
                                <use href="#leg-calf" xlink:href="#leg-calf" class="fur-back" />
                            </g>
                        </g>
                    </g>
                    <!-- far front -->
                    <g transform="translate(10, 1)">
                        <g class="run-f-shoulder offset-anim" style="transform-origin: 0px 0px;">
                            <use href="#leg-upper" xlink:href="#leg-upper" class="fur-back" />
                            <g class="run-f-arm offset-anim" transform="translate(0, 6)" style="transform-origin: 0px 0px;">
                                <use href="#leg-fore" xlink:href="#leg-fore" class="fur-back" />
                            </g>
                        </g>
                    </g>

                    <!-- tapered tail -->
                    <path class="fur-limb run-tail" d="M -14 -2.5 C -22 -3.5, -28 -5, -34 -9 Q -35.2 -9.5 -34.6 -8 C -29 -3.5, -22 0, -14 0.8 Z" />

                    <g class="run-torso">
                        <use href="#torso" xlink:href="#torso" class="fur" />
                        <use href="#torso-stripes" xlink:href="#torso-stripes" />
                    </g>

                    <!-- near hind -->
                    <g transform="translate(-10, 2)">
                        <g class="run-b-thigh" style="transform-origin: 0px 0px;">
                            <use href="#leg-thigh" xlink:href="#leg-thigh" class="fur" />
                            <g class="run-b-calf" transform="translate(0, 7)" style="transform-origin: 0px 0px;">
                                <use href="#leg-calf" xlink:href="#leg-calf" class="fur-limb" />
                            </g>
                        </g>
                    </g>
                    <!-- near front -->
                    <g transform="translate(8, 2)">
                        <g class="run-f-shoulder" style="transform-origin: 0px 0px;">
                            <use href="#leg-upper" xlink:href="#leg-upper" class="fur-limb" />
                            <g class="run-f-arm" transform="translate(0, 6)" style="transform-origin: 0px 0px;">
                                <use href="#leg-fore" xlink:href="#leg-fore" class="fur-limb" />
                            </g>
                        </g>
                    </g>

                    <g class="run-head-grp">
                        <g transform="translate(15, -3)">
                            <use href="#head-base" xlink:href="#head-base" />
                            <use href="#eye-open" xlink:href="#eye-open" />
                        </g>
                    </g>
                </g>
            </g>

            <!-- WONDER (standing, watching the packet) -->
            <g class="state-wonder">
                <path class="fur-limb wonder-tail" d="M -14 -0.5 C -20 -3, -22 -11, -17 -18 Q -16 -19.2 -15.6 -18 C -19 -11, -17 -4, -13 2.5 Z" />

                <use href="#stand-hind" xlink:href="#stand-hind" class="fur-back" transform="translate(3.5, -0.5)" />
                <use href="#stand-front" xlink:href="#stand-front" class="fur-back" transform="translate(-3.5, -0.5)" />

                <g transform="translate(0, 1)">
                    <use href="#torso" xlink:href="#torso" class="fur" />
                    <use href="#torso-stripes" xlink:href="#torso-stripes" />
                </g>

                <use href="#stand-hind" xlink:href="#stand-hind" class="fur-limb" />
                <use href="#stand-front" xlink:href="#stand-front" class="fur-limb" />

                <g class="wonder-head">
                    <g transform="translate(14, -5)">
                        <use href="#head-base" xlink:href="#head-base" />
                        <use href="#eye-open" xlink:href="#eye-open" />
                    </g>
                </g>
            </g>

            <!-- GROOM (sitting, licking raised paw) -->
            <g class="state-groom">
                <path class="fur-back" d="M 3 8 L 3.5 17.4 Q 3.3 18.7 4.7 18.7 L 7.5 18.7 Q 8.5 18.4 7.5 17.4 L 6.5 16.8 L 6.7 9 Z" />

                <path class="fur" d="M -12.5 18.6 C -16.5 15, -15.5 8, -10.5 4 C -7.5 1.5, -4.5 -3, -1.5 -8 C 0.5 -10.5, 5 -10, 7 -6 C 9 -2, 9.5 4, 8 9 C 7 12.5, 6.5 15.5, 6.5 18.6 Z" />
                <path class="stripe" d="M -11 5 Q -9 6 -8.5 8 M -8.5 2.5 Q -6.5 3.5 -6 5.5 M -5.5 -1 Q -3.6 0 -3.2 2" />
                <ellipse class="fur" cx="-7" cy="13" rx="7" ry="5.8" />
                <ellipse class="fur-limb" cx="-1" cy="17.9" rx="3.6" ry="1.1" />

                <path class="tail-stroke groom-tail" d="M -11 15 C -17 18.5, -9 19.6, -1 18.9 C 3 18.6, 6 18.2, 8.5 16.8" />

                <path class="fur-limb" d="M 2.5 3 C 4 8, 8 10.5, 10.8 9 C 12 8.2, 12.4 5, 12.6 1.2 Q 12.8 -1 11.2 -1.3 Q 9.6 -1.2 9.8 0.8 L 9.6 5.8 C 8.2 6.4, 6.5 4.5, 6 2 Z" />

                <g class="groom-head">
                    <g transform="translate(5, -7) rotate(40)">
                        <use href="#head-base" xlink:href="#head-base" />
                        <path class="eyes-closed" d="M 2.6 -2.6 Q 4 -1.8 5.4 -2.8" />
                        <path class="tongue" d="M 7.2 1.4 Q 8.4 1.8 8.2 3 Q 7.4 3.2 7 2.2 Z" />
                    </g>
                </g>
            </g>
        </g>
    </g>
</svg>
